<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" width="400" height="90">
  <!-- Monogram Symbol -->
  <g transform="translate(10, 15)">
    <!-- Architectural Geometric Monogram for Idtaly -->
    <rect x="0" y="0" width="12" height="60" fill="#000000" />
    <rect x="18" y="0" width="6" height="60" fill="#000000" />
    <polygon points="12,18 28,18 28,24 12,24" fill="#000000" />
    <polygon points="12,36 36,36 36,42 12,42" fill="#000000" />
  </g>
  
  <!-- Typography -->
